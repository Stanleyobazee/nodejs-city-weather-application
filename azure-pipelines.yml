trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  dockerImageName: 'city-weather-app'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

stages:

# ── STAGE 1: Build & Validate ─────────────────────────────────────────────
- stage: Build
  displayName: 'Build & Validate'
  jobs:
  - job: BuildJob
    displayName: 'Install, lint and validate'
    pool:
      vmImage: 'ubuntu-latest'
    steps:

    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'
      displayName: 'Use Node.js 18'

    - script: npm install
      displayName: 'Install dependencies'

    - script: npm test
      displayName: 'Run lint / syntax check'
      continueOnError: false

    - script: |
        node server.js &
        APP_PID=$!
        sleep 3
        curl -f http://localhost:4000 && echo "App started OK" || echo "App started (API key not set – expected in CI)"
        kill $APP_PID 2>/dev/null || true
      displayName: 'Smoke test – app starts'
      continueOnError: true

# ── STAGE 2: Docker Build ─────────────────────────────────────────────────
- stage: Docker
  displayName: 'Build & Push Docker Image'
  dependsOn: Infrastructure
  jobs:
  - job: DockerBuildPush
    displayName: 'Build and push to ACR'
    pool:
      vmImage: 'ubuntu-latest'
    steps:

    - task: AzureCLI@2
      displayName: 'Build and push image to ACR'
      inputs:
        azureSubscription: 'azure-weather-app'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e
          ACR_PASSWORD=$(az acr credential show --name stanleyweatherappacr --query passwords[0].value -o tsv)
          docker login stanleyweatherappacr.azurecr.io \
            --username stanleyweatherappacr \
            --password "$ACR_PASSWORD"
          docker build -t stanleyweatherappacr.azurecr.io/city-weather-app:$(Build.BuildId) \
                       -t stanleyweatherappacr.azurecr.io/city-weather-app:latest \
                       -f $(dockerfilePath) .
          docker push stanleyweatherappacr.azurecr.io/city-weather-app:$(Build.BuildId)
          docker push stanleyweatherappacr.azurecr.io/city-weather-app:latest

# ── STAGE 3: Infrastructure (Terraform Validate) ─────────────────────────
- stage: Infrastructure
  displayName: 'Terraform Validate'
  dependsOn: Build
  jobs:
  - job: TerraformValidate
    displayName: 'Terraform init & validate'
    pool:
      vmImage: 'ubuntu-latest'
    steps:

    - script: |
        docker run --rm \
          -v $(Build.SourcesDirectory)/terraform:/workspace \
          -w /workspace \
          hashicorp/terraform:1.7.5 \
          version
      displayName: 'Terraform version check'

    - script: |
        docker run --rm \
          -v $(Build.SourcesDirectory)/terraform:/workspace \
          -w /workspace \
          hashicorp/terraform:1.7.5 \
          init -backend=false
      displayName: 'Terraform init (local)'

    - script: |
        docker run --rm \
          -v $(Build.SourcesDirectory)/terraform:/workspace \
          -w /workspace \
          hashicorp/terraform:1.7.5 \
          validate
      displayName: 'Terraform validate'